name: Deploy Frontend to VPS

on:
  push:
    branches:
      - frd-ads

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate static files
        run: npm run generate
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          
      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          
      - name: Clear previous frontend files on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "rm -rf /home/scentral/app/frontend-dist/*"
          
      - name: Deploy frontend files to VPS
        run: |
          scp -r .output/public/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/scentral/app/frontend-dist/
          
      - name: Restart scentral service on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo systemctl restart scentral"