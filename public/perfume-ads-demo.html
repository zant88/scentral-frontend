<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Video Ads API Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .brand-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .brand-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .video-card {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: white;
        }
        .brand-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
        }
        .stats-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 50px;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .api-url {
            background-color: #f1f3f4;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            word-break: break-all;
        }
        .copy-btn {
            cursor: pointer;
        }
        .badge-priority {
            font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-video text-primary"></i> 
                    Perfume Video Ads API Demo
                </h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">API Configuration</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <label for="apiUrl" class="form-label">API URL:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="apiUrl" 
                                           value="http://192.168.18.132:3030/api/video-player/manifest/866902946400001" 
                                           readonly>
                                    <button class="btn btn-outline-secondary copy-btn" onclick="copyApiUrl()">
                                        <i class="fas fa-copy"></i> Copy
                                    </button>
                                </div>
                                <small class="form-text text-muted">
                                    This is the original manifest API endpoint. The demo fetches data from this endpoint and formats it to show perfume ads grouped by brand.
                                </small>
                            </div>
                            <div class="col-md-4">
                                <label for="machineId" class="form-label">Machine ID:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="machineId" 
                                           value="866902946400001">
                                    <button class="btn btn-primary" onclick="fetchPerfumeAds()">
                                        <i class="fas fa-sync"></i> Fetch
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="loading" class="loading d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Fetching perfume ads...</p>
                </div>
                
                <div id="error" class="error d-none"></div>
                
                <div id="statsContainer" class="row d-none">
                    <div class="col-md-4">
                        <div class="stats-card text-center">
                            <i class="fas fa-building fa-3x text-primary mb-3"></i>
                            <h2 id="totalBrands" class="mb-1">0</h2>
                            <p class="text-muted">Total Brands</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card text-center">
                            <i class="fas fa-video fa-3x text-success mb-3"></i>
                            <h2 id="totalVideos" class="mb-1">0</h2>
                            <p class="text-muted">Total Videos</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stats-card text-center">
                            <i class="fas fa-tv fa-3x text-warning mb-3"></i>
                            <h2 id="machineIdDisplay" class="mb-1">-</h2>
                            <p class="text-muted">Machine ID</p>
                        </div>
                    </div>
                </div>
                
                <div id="resultsContainer" class="d-none"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch perfume ads from the API
        async function fetchPerfumeAds() {
            const machineId = document.getElementById('machineId').value;
            const apiUrl = `http://192.168.18.132:3030/api/video-player/manifest/${machineId}`;
            
            // Show loading
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('error').classList.add('d-none');
            document.getElementById('statsContainer').classList.add('d-none');
            document.getElementById('resultsContainer').classList.add('d-none');
            
            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.message || 'Failed to fetch manifest');
                }
                
                // Process the data
                processPerfumeAds(data.data.perfume_ads || [], machineId, "manifest_api");
                
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        }
        
        // Process perfume ads and display them
        function processPerfumeAds(perfumeAds, machineId, source) {
            // Ensure we have an array
            if (!Array.isArray(perfumeAds)) {
                perfumeAds = [];
            }
            
            // Group perfume ads by brand
            const perfumeAdsByBrand = {};
            
            perfumeAds.forEach(ad => {
                const brandId = ad.brand_id;
                const brandName = ad.brand_name || `Brand ${brandId}`;
                
                if (!perfumeAdsByBrand[brandId]) {
                    perfumeAdsByBrand[brandId] = {
                        brand_id: brandId,
                        brand_name: brandName,
                        videos: []
                    };
                }
                
                perfumeAdsByBrand[brandId].videos.push({
                    id: ad.id,
                    title: ad.title,
                    description: ad.description,
                    file_path: ad.file_path,
                    thumbnail_path: ad.thumbnail_path,
                    duration_seconds: ad.duration_seconds,
                    cost_per_play: ad.cost_per_play,
                    priority: ad.priority,
                    play_count: ad.play_count,
                    last_played: ad.last_played
                });
            });
            
            // Convert to array
            const result = Object.values(perfumeAdsByBrand);
            
            // Update stats
            document.getElementById('totalBrands').textContent = result.length;
            document.getElementById('totalVideos').textContent = perfumeAds.length;
            document.getElementById('machineIdDisplay').textContent = machineId;
            document.getElementById('statsContainer').classList.remove('d-none');
            
            // Display results
            displayResults(result, source);
        }
        
        // Display the results
        function displayResults(perfumeAdsData, source) {
            const container = document.getElementById('resultsContainer');
            
            if (perfumeAdsData.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i> No active perfume videos found.
                        <div class="mt-2">
                            <small>
                                <strong>Data source:</strong> ${source || 'unknown'}<br>
                                This means there are no videos with ad_type='perfume' and status='active' in the system.<br>
                                <strong>Note:</strong> Perfume ads are included if active, regardless of slot assignments.
                            </small>
                        </div>
                    </div>
                `;
            } else {
                let html = `
                    <div class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        Successfully fetched perfume videos from <strong>${source}</strong>
                        <br>
                        <small><strong>Note:</strong> Perfume ads are included if active, regardless of slot assignments.</small>
                    </div>
                `;
                
                perfumeAdsData.forEach(brand => {
                    html += `
                        <div class="brand-card card">
                            <div class="brand-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-building me-2"></i>
                                    ${brand.brand_name}
                                    <span class="badge bg-light text-dark ms-2">${brand.videos.length} videos</span>
                                    <span class="badge bg-secondary ms-1">ID: ${brand.brand_id}</span>
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                    `;
                    
                    brand.videos.forEach(video => {
                        const priorityClass = getPriorityClass(video.priority);
                        const lastPlayed = video.last_played ? new Date(video.last_played).toLocaleString() : 'Never';
                        
                        html += `
                            <div class="col-md-6">
                                <div class="video-card">
                                    <h6>${video.title}</h6>
                                    <p class="text-muted small mb-2">${video.description || 'No description'}</p>
                                    
                                    <div class="row mb-2">
                                        <div class="col-6">
                                            <small><strong>ID:</strong> ${video.id}</small>
                                        </div>
                                        <div class="col-6">
                                            <small><strong>Duration:</strong> ${video.duration_seconds}s</small>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-2">
                                        <div class="col-6">
                                            <small><strong>Cost:</strong> $${video.cost_per_play}</small>
                                        </div>
                                        <div class="col-6">
                                            <small><strong>Priority:</strong> <span class="badge ${priorityClass} badge-priority">${video.priority}</span></small>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-6">
                                            <small><strong>Plays:</strong> ${video.play_count}</small>
                                        </div>
                                        <div class="col-6">
                                            <small><strong>Last played:</strong> ${lastPlayed}</small>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex justify-content-between">
                                        <button class="btn btn-sm btn-outline-primary" onclick="previewVideo('${video.file_path}', '${video.title}')">
                                            <i class="fas fa-play"></i> Preview
                                        </button>
                                        <button class="btn btn-sm btn-outline-secondary" onclick="copyText('${video.file_path}')">
                                            <i class="fas fa-copy"></i> Copy URL
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            }
            
            container.classList.remove('d-none');
        }
        
        // Get priority class
        function getPriorityClass(priority) {
            switch (priority) {
                case 'high': return 'bg-danger';
                case 'medium': return 'bg-warning';
                case 'low': return 'bg-success';
                default: return 'bg-secondary';
            }
        }
        
        // Show error message
        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = `Error: ${message}`;
            errorElement.classList.remove('d-none');
        }
        
        // Copy API URL
        function copyApiUrl() {
            copyText(document.getElementById('apiUrl').value);
        }
        
        // Copy text to clipboard
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast('Failed to copy');
            });
        }
        
        // Show toast notification
        function showToast(message) {
            const toastHtml = `
                <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
                    <div class="toast show" role="alert">
                        <div class="toast-header">
                            <strong class="me-auto">Notification</strong>
                            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                        </div>
                        <div class="toast-body">
                            ${message}
                        </div>
                    </div>
                </div>
            `;
            
            const toastElement = document.createElement('div');
            toastElement.innerHTML = toastHtml;
            document.body.appendChild(toastElement);
            
            setTimeout(() => {
                document.body.removeChild(toastElement);
            }, 3000);
        }
        
        // Preview video
        function previewVideo(videoUrl, videoTitle) {
            window.open(videoUrl, '_blank');
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            fetchPerfumeAds();
        });
    </script>
</body>
</html>
