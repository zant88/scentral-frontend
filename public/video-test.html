<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .video-container {
      max-width: 800px;
      width: 100%;
      margin: 2rem 0;
    }
    video {
      width: 100%;
      height: auto;
    }
    .error {
      color: red;
      padding: 1rem;
      border: 1px solid red;
      border-radius: 4px;
      margin-top: 1rem;
      display: none;
    }
    .buttons {
      margin: 1rem 0;
    }
    button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Video Test Page</h1>
  
  <div class="video-container">
    <video id="testVideo" controls autoplay muted playsinline>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  
  <div class="buttons">
    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="reloadBtn">Reload Video</button>
  </div>
  
  <div id="errorMessage" class="error"></div>
  <div id="statusMessage" style="margin-top: 1rem;">Loading video...</div>
  
  <script>
    const video = document.getElementById('testVideo');
    const errorMessage = document.getElementById('errorMessage');
    const statusMessage = document.getElementById('statusMessage');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    
    // Event listeners for video
    video.addEventListener('loadeddata', () => {
      console.log('Video loaded successfully');
      statusMessage.textContent = 'Video loaded successfully';
    });
    
    video.addEventListener('canplay', () => {
      console.log('Video can play now');
      statusMessage.textContent = 'Video can play now';
      video.play().catch(e => {
        console.error('Auto-play failed:', e);
        statusMessage.textContent = 'Auto-play failed. Please click the play button.';
      });
    });
    
    video.addEventListener('playing', () => {
      statusMessage.textContent = 'Video is playing';
    });
    
    video.addEventListener('pause', () => {
      statusMessage.textContent = 'Video is paused';
    });
    
    video.addEventListener('error', (e) => {
      console.error('Video error:', e);
      errorMessage.textContent = `Error loading video: ${video.error ? video.error.message : 'Unknown error'}`;
      errorMessage.style.display = 'block';
      statusMessage.textContent = 'Failed to load video';
    });
    
    // Button controls
    playBtn.addEventListener('click', () => {
      video.play().catch(e => {
        console.error('Play failed:', e);
        statusMessage.textContent = 'Play failed: ' + e.message;
      });
    });
    
    pauseBtn.addEventListener('click', () => {
      video.pause();
    });
    
    reloadBtn.addEventListener('click', () => {
      video.load();
      statusMessage.textContent = 'Reloading video...';
    });
  </script>
</body>
</html>
